name: Revisión
on:
  push:
    branches: [main]
  pull_request:
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - run: node tools/empaquetar.mjs
